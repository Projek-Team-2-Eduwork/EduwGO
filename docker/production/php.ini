; Override php.ini-production untuk EduwGo
date.timezone = Asia/Jakarta
expose_php = Off
memory_limit = 256M
; Foto kendaraan maks 2 MB (VehicleRequest), logo maks 512 KB (SettingRequest)
upload_max_filesize = 4M
post_max_size = 8M

opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
